services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sales
      POSTGRES_USER: sales
      POSTGRES_PASSWORD: sales
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U sales -d sales"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 20s

  backend:
    build: ./backend
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=sales;Username=sales;Password=sales"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata: